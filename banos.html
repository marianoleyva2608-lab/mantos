<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de Baños · AD-PACK</title>
<link rel="manifest" href="/manifest-banos.json">
<meta name="theme-color" content="#1a5c2a">
<link rel="icon" href="/icon-etiquetas-192.png">
<link rel="apple-touch-icon" href="/icon-etiquetas-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baños AD-PACK">
<style>
  :root{
    --verde:#1a5c2a; --verde-claro:#e8f5e9; --rojo:#c62828; --amber:#f9a825;
    --bg:#f4f6f5; --card:#fff; --line:#e0e0e0; --txt:#1c1c1c; --muted:#666;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--txt);font-size:17px}
  header{background:var(--verde);color:#fff;padding:14px 20px;display:flex;
         flex-wrap:wrap;gap:12px;align-items:center}
  header h1{font-size:22px;margin:0;font-weight:700;flex:1;min-width:180px}
  header span{font-size:15px;opacity:.85}
  main{padding:18px;max-width:1000px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
  .card h2{font-size:17px;margin:0 0 14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .form-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  .form-row label{display:flex;flex-direction:column;font-size:15px;color:var(--muted);gap:5px;flex:1;min-width:240px}
  .form-row select{padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:17px;background:var(--card);color:var(--txt)}
  button{font:inherit;font-size:17px;padding:13px 22px;border-radius:8px;border:1px solid #0003;background:#fff;color:var(--verde);
         font-weight:700;cursor:pointer}
  button.primary{background:var(--verde);color:#fff}
  button.salir{background:var(--amber);color:#000}
  button:disabled{opacity:.5;cursor:not-allowed}
  .msg{font-size:16px;min-height:20px;margin-top:10px}
  .msg.error{color:var(--rojo)}
  .msg.ok{color:var(--verde)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:16px}
  th{color:var(--muted);font-weight:600}
  .muted{color:var(--muted)}
  .badge{display:inline-block;padding:3px 11px;border-radius:10px;font-size:14px;font-weight:700;background:var(--verde-claro);color:var(--verde)}
  .badge.tarde{background:#ffe0e0;color:var(--rojo)}
  .scroll{overflow-x:auto}
  .btnsalir{padding:8px 16px;font-size:15px}
  @media(prefers-color-scheme:dark){
    :root{--bg:#141715;--card:#1e211f;--line:#333;--txt:#eee;--muted:#9aa;--verde-claro:#1f3a26}
  }
</style>
</head>
<body>
<header>
  <button onclick="location.href='/'" title="Menú principal" style="background:rgba(255,255,255,.2);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0">&#8249;</button>
  <h1>🚻 Control de Baños</h1>
  <span id="reloj"></span>
</header>

<main>
  <div class="card">
    <h2>Registrar</h2>
    <div class="form-row">
      <label>Nombre
        <select id="f_nombre" onchange="actualizarBotones()">
          <option value="">Selecciona tu nombre</option>
        </select>
      </label>
      <button id="btnEntrada" class="primary" disabled onclick="registrar('entrada')">Entrada</button>
      <button id="btnSalida" class="salir" disabled onclick="registrar('salida')">Salida</button>
    </div>
    <div id="msgEntrada" class="msg"></div>
  </div>

  <div class="card">
    <h2>Actualmente en el baño</h2>
    <div class="scroll">
      <table id="tActivos"><thead><tr>
        <th>Nombre</th><th>Desde</th><th>Tiempo</th><th></th>
      </tr></thead><tbody></tbody></table>
    </div>
  </div>

  <div class="card">
    <h2>Historial de hoy</h2>
    <div class="scroll">
      <table id="tHistorial"><thead><tr>
        <th>Nombre</th><th>Entrada</th><th>Salida</th><th>Duración</th>
      </tr></thead><tbody></tbody></table>
    </div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const LIMITE_MIN = 15; // min a partir del cual se marca "tarde"
let ACTIVOS = [];

function hhmm(iso){ if(!iso) return '—';
  return new Date(iso).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Mexico_City'}); }
function minsDesde(iso){ return Math.max(0, Math.round((Date.now()-new Date(iso))/60000)); }
function dur(iniIso, finIso){
  const seg = (new Date(finIso) - new Date(iniIso))/1000;
  const m = Math.round(seg/60);
  return m < 60 ? m+' min' : (m/60).toFixed(1)+' h';
}

async function cargarNombres(){
  try{
    const r = await fetch('/api/banos/personal');
    const nombres = await r.json();
    $('#f_nombre').innerHTML = '<option value="">Selecciona tu nombre</option>' +
      nombres.map(n=>`<option value="${n}">${n}</option>`).join('');
  }catch(e){}
}

function actualizarBotones(){
  const nombre = $('#f_nombre').value;
  if(!nombre){ $('#btnEntrada').disabled = true; $('#btnSalida').disabled = true; return; }
  const adentro = ACTIVOS.some(a=>a.nombre === nombre);
  $('#btnEntrada').disabled = adentro;
  $('#btnSalida').disabled = !adentro;
}

async function registrar(tipo){
  const nombre = $('#f_nombre').value;
  if(!nombre) return;
  const msg = $('#msgEntrada');
  msg.textContent = ''; msg.className = 'msg';
  try{
    const r = await fetch(`/api/banos/${tipo}`, {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({nombre})});
    const d = await r.json();
    if(d.ok){
      msg.textContent = tipo === 'salida' ? `Salida registrada: ${nombre}` : `Entrada registrada: ${nombre}`;
      msg.className = 'msg ok';
      $('#f_nombre').value = '';
      await cargar();
      actualizarBotones();
    } else {
      msg.textContent = d.error || 'No se pudo registrar'; msg.className = 'msg error';
    }
  }catch(e){ msg.textContent = 'Error de conexión'; msg.className = 'msg error'; }
}

async function registrarSalida(nombre){
  await fetch('/api/banos/salida', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({nombre})});
  await cargar();
  actualizarBotones();
}

async function cargar(){
  const [activos, historial] = await Promise.all([
    fetch('/api/banos/estado').then(r=>r.json()),
    fetch('/api/banos/historial').then(r=>r.json()),
  ]);
  ACTIVOS = activos;

  $('#tActivos tbody').innerHTML = activos.map(a=>{
    const m = minsDesde(a.entrada);
    return `<tr>
      <td>${a.nombre}</td><td>${hhmm(a.entrada)}</td>
      <td><span class="badge ${m>=LIMITE_MIN?'tarde':''}">${m} min</span></td>
      <td><button class="salir btnsalir" onclick="registrarSalida('${a.nombre.replace(/'/g,"\\'")}')">Salir</button></td>
    </tr>`;
  }).join('') || '<tr><td colspan="4" class="muted">Nadie en el baño</td></tr>';

  $('#tHistorial tbody').innerHTML = historial.map(h=>`
    <tr>
      <td>${h.nombre}</td><td>${hhmm(h.entrada)}</td>
      <td>${h.salida ? hhmm(h.salida) : '<b>adentro</b>'}</td>
      <td>${h.salida ? dur(h.entrada, h.salida) : '—'}</td>
    </tr>`).join('') || '<tr><td colspan="4" class="muted">Sin registros hoy</td></tr>';
}

function reloj(){ $('#reloj').textContent = new Date().toLocaleTimeString('es-MX',{hour12:false,timeZone:'America/Mexico_City'}); }

(async()=>{
  await cargarNombres();
  await cargar();
  actualizarBotones();
  reloj(); setInterval(reloj, 1000);
  setInterval(async()=>{ await cargar(); actualizarBotones(); }, 10000);
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw-banos.js').catch(function () {});
    });
  }
</script>
</body>
</html>
