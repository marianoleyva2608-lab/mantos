<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistencia · ADPACK</title>
<style>
  :root { --verde:#1F5C2E; --verde2:#2f6b3c; --borde:#e2e6e3; --bg:#f4f6f4; --txt:#1c2320; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  .top { background:var(--verde); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:12px; }
  .top a.back { color:#fff; text-decoration:none; font-size:22px; line-height:1; }
  .top h1 { margin:0; font-size:18px; }
  .top .sub { opacity:.85; font-size:13px; }
  .wrap { max-width:1000px; margin:0 auto; padding:16px; }
  form.filtros { display:flex; flex-wrap:wrap; gap:10px; align-items:end; background:#fff; border:1px solid var(--borde); border-radius:12px; padding:14px; margin-bottom:14px; }
  .campo { display:flex; flex-direction:column; gap:4px; }
  .campo label { font-size:12px; color:#5b6560; }
  input { padding:9px 10px; border:1px solid var(--borde); border-radius:8px; font-size:14px; }
  .btn { background:var(--verde); color:#fff; border:0; border-radius:8px; padding:10px 16px; font-size:14px; cursor:pointer; text-decoration:none; display:inline-block; }
  .btn.sec { background:#fff; color:var(--verde); border:1px solid var(--verde); }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--borde); border-radius:12px; overflow:hidden; }
  th,td { padding:11px 12px; text-align:left; font-size:14px; border-bottom:1px solid var(--borde); }
  th { background:#eef3ef; font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:#5b6560; }
  tr:last-child td { border-bottom:0; }
  .tipo { padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; }
  .t-ent { background:#e3f3e6; color:#1F5C2E; }
  .t-sal { background:#fdeaea; color:#b23; }
  .t-tarde { background:#fff3df; color:#9a5b00; }
  .meta { color:#5b6560; font-size:13px; margin:2px 0 12px; }
  .foto { width:34px; height:34px; border-radius:50%; object-fit:cover; vertical-align:middle; margin-right:8px; background:#e2e6e3; }
  .vacio { text-align:center; padding:44px; color:#7a847f; background:#fff; border:1px solid var(--borde); border-radius:12px; }
</style>
</head>
<body>
<div class="top">
  <a class="back" href="/" title="Inicio">&#8592;</a>
  <div>
    <h1>&#128197; Asistencia</h1>
    <div class="sub">Checadas de los checadores · Matriz y Conversión</div>
  </div>
</div>

<div class="wrap">
  <form class="filtros" onsubmit="cargar();return false;">
    <div class="campo"><label>Planta</label><select id="planta" onchange="cargar()" style="padding:9px 10px;border:1px solid var(--borde);border-radius:8px;font-size:14px;"><option value="">Todas</option><option>Matriz</option><option>Conversión</option></select></div>
    <div class="campo"><label>Desde</label><input type="date" id="desde"></div>
    <div class="campo"><label>Hasta</label><input type="date" id="hasta"></div>
    <div class="campo" style="flex:1;min-width:160px;">
      <label>Nombre o No. empleado</label>
      <input type="text" id="nombre" placeholder="Buscar…">
    </div>
    <button class="btn" type="submit">Filtrar</button>
    <a class="btn sec" href="#" onclick="limpiar();return false;">Limpiar</a>
    <a class="btn" id="sem" href="#" onclick="exportarSemanal();return false;" title="Entrada y salida por día de cada persona, llegadas tarde y faltas. Elige la planta o deja Todas para el reporte general. Sin fechas toma la semana actual.">&#128197; Reporte semanal</a>
    <a class="btn sec" href="/horarios">&#9201; Horarios</a>
  </form>
  <div id="imp-msg" style="display:none;margin:0 0 12px;padding:10px 12px;border-radius:8px;font-size:13px;"></div>

  <div class="meta" id="meta">Cargando…</div>
  <div id="cont"></div>
</div>

<script>
function qs(){
  const p=new URLSearchParams();
  const d=document.getElementById('desde').value;
  const h=document.getElementById('hasta').value;
  const n=document.getElementById('nombre').value.trim();
  const pl=document.getElementById('planta').value;
  if(d)p.set('desde',d); if(h)p.set('hasta',h); if(n)p.set('nombre',n); if(pl)p.set('planta',pl);
  return p.toString();
}
function fmt(s){ if(!s)return''; return String(s).replace('T',' ').replace(/[+-]\d\d:\d\d$/,'').slice(0,19); }
function limpiar(){ document.getElementById('desde').value=''; document.getElementById('hasta').value=''; document.getElementById('nombre').value=''; document.getElementById('planta').value=''; cargar(); }
function exportar(){ window.location.href='/api/checadas/export?'+qs(); }
function exportarExcel(){ window.location.href='/api/checadas/export/excel?'+qs(); }
function exportarSemanal(){ window.location.href='/api/checadas/export/semanal?'+qs(); }
async function importar(input){
  const file=input.files[0]; if(!file)return;
  const msg=document.getElementById('imp-msg');
  msg.style.display='block'; msg.style.background='#eef3ef'; msg.style.color='#5b6560';
  msg.textContent='Importando '+file.name+'…';
  const pl=document.getElementById('planta').value;
  if(!pl){ msg.style.background='#fdeaea'; msg.style.color='#b23'; msg.textContent='Elige primero la planta (Matriz o Conversión) a la que pertenece el archivo.'; input.value=''; return; }
  const fd=new FormData(); fd.append('archivo',file); fd.append('planta',pl);
  try{
    const r=await fetch('/api/checadas/import',{method:'POST',body:fd});
    const d=await r.json();
    if(d.ok){ msg.style.background='#e3f3e6'; msg.style.color='#1F5C2E';
      msg.textContent='✓ Listo: '+d.cargadas+' checada(s) cargadas (de '+d.leidas+' filas leídas).';
      cargar();
    } else {
      msg.style.background='#fdeaea'; msg.style.color='#b23';
      msg.textContent='Error: '+(d.error||'no se pudo importar')+(d.encabezados_detectados?(' · Columnas: '+d.encabezados_detectados.join(', ')):'');
    }
  }catch(e){ msg.style.background='#fdeaea'; msg.style.color='#b23'; msg.textContent='Error: '+e; }
  input.value='';
}
let FOTOS=null;
function foto(no){ const v=FOTOS&&FOTOS[no]; return v?'<img class="foto" loading="lazy" src="/api/empleados/'+encodeURIComponent(no)+'/foto?v='+v+'" alt="">':''; }
async function cargar(){
  if(FOTOS===null){ try{ FOTOS=await (await fetch('/api/empleados/fotos')).json(); }catch(e){ FOTOS={}; } }
  const meta=document.getElementById('meta'), cont=document.getElementById('cont');
  meta.textContent='Cargando…'; cont.innerHTML='';
  try{
    const r=await fetch('/api/checadas?'+qs());
    const filas=await r.json();
    meta.textContent='Mostrando '+filas.length+' checada(s).';
    if(!filas.length){ cont.innerHTML='<div class="vacio">Aún no hay checadas con estos filtros.<br>Cuando alguien checa en el aparato, aparece aquí.</div>'; return; }
    let t='<table><thead><tr><th>Fecha y hora</th><th>Planta</th><th>No.</th><th>Nombre</th><th>Tipo</th><th>Método</th></tr></thead><tbody>';
    for(const x of filas){
      const tipo=x.tipo||'';
      const cls = x.retardo?'t-tarde':(tipo.includes('ntrada')?'t-ent':(tipo.includes('alida')?'t-sal':''));
      t+='<tr><td>'+fmt(x.fecha_hora)+'</td><td>'+(x.planta||'Matriz')+'</td><td>'+(x.empleado_no||'')+'</td><td>'+foto(x.empleado_no)+(x.nombre||'')+'</td><td><span class="tipo '+cls+'">'+tipo+'</span></td><td>'+(x.metodo||'')+'</td></tr>';
    }
    t+='</tbody></table>'; cont.innerHTML=t;
  }catch(e){ meta.textContent='Error al leer las checadas: '+e; }
}
cargar();
// Auto-actualiza cada 15 s para mostrar checadas nuevas sin recargar
setInterval(cargar, 15000);
</script>
</body>
</html>
